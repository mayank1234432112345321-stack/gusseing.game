<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucky Color Ball</title>
<style>
:root{--gold:#f7c64b;--cream:#fff4c9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 30%,#176d55,#062c29 66%,#03171d);font-family:system-ui,sans-serif;color:var(--cream)}main{width:min(100%,680px);padding:clamp(22px,5vw,40px);text-align:center;border:2px solid #f7c64b8c;border-radius:26px;background:linear-gradient(135deg,#083e38dd,#0a1f2bd9);box-shadow:0 0 0 7px #071d27,0 0 0 9px #f7c64b55,0 24px 65px #0008}.eyebrow{margin:0;color:var(--gold);letter-spacing:.16em;font-size:.76rem;font-weight:800}h1{margin:6px 0 8px;font-family:Georgia,serif;font-size:clamp(2rem,6vw,3rem);color:var(--gold);text-shadow:0 2px #5b3710}.sub{margin:0 0 22px;color:#ffefae}.machine{height:218px;display:grid;place-items:center;margin:6px auto 22px;border-radius:50%;background:radial-gradient(circle,#2d8c6c 0 48%,#063e36 49% 57%,#f7c64b 58% 60%,transparent 61%);position:relative}.machine:before,.machine:after{content:"✦";position:absolute;color:var(--gold);font-size:25px}.machine:before{left:12%;top:22%}.machine:after{right:12%;bottom:18%}.ball{width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 31% 24%,#fff 0 9%,#fff8 10%,transparent 24%),linear-gradient(145deg,#ff5964,#a8102c);box-shadow:inset -16px -18px 26px #0006,inset 13px 12px 20px #fff5,0 12px 18px #0007;transition:transform .3s}.ball.waiting{background:radial-gradient(circle at 31% 24%,#fff 0 9%,#fff8 10%,transparent 24%),linear-gradient(145deg,#52798d,#162c3b)}.spinning .ball{animation:spin .42s linear infinite,hop .42s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes hop{50%{translate:0 -8px}}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.color{min-height:50px;border:2px solid #fff7;border-radius:14px;color:#fff;font:800 1rem system-ui;cursor:pointer;text-shadow:0 1px 2px #0007}.color:hover:not(:disabled),.color.selected{outline:3px solid var(--gold);outline-offset:2px;filter:brightness(1.14)}.red{background:#e43d48}.blue{background:#397edf}.green{background:#29a967}.yellow{background:#d89d09}.purple{background:#8e56d4}.orange{background:#e77725}.color:disabled{opacity:.55;cursor:default}#status{min-height:34px;margin:20px 0 7px;font-weight:800;font-size:1.13rem}.score{color:#ffefae}.score b{color:var(--gold);font-size:1.3rem}#play{margin-top:14px;border:0;border-radius:12px;padding:14px 28px;background:linear-gradient(#ffd66c,#ce8c18);color:#331c00;font:800 1rem system-ui;cursor:pointer;box-shadow:0 4px #79430b}#play:active{transform:translateY(3px);box-shadow:0 1px #79430b}.note{margin:20px 0 0;font-size:.78rem;color:#d7e8cb}@media(max-width:400px){.colors{grid-template-columns:repeat(2,1fr)}.machine{height:190px}.ball{width:118px;height:118px}}
</style></head><body><main><p class="eyebrow">LUCKY COLORS · JUST FOR FUN</p><h1>Color Ball</h1><p class="sub">Pick a color — the ball reveals its color in 3 seconds</p><p class="history" id="history" aria-live="polite">Results: No balls yet</p><div class="machine" id="machine"><div class="ball waiting" id="ball" aria-label="Hidden color ball"></div></div><div class="colors" id="colors" aria-label="Choose a color"><button class="color red" data-color="red">RED</button><button class="color blue" data-color="blue">BLUE</button><button class="color green" data-color="green">GREEN</button><button class="color yellow" data-color="yellow">YELLOW</button><button class="color purple" data-color="purple">PURPLE</button><button class="color orange" data-color="orange">ORANGE</button></div><p id="status" aria-live="polite">Choose your lucky color</p><div class="score">Correct guesses: <b id="score">0</b> · Round: <b id="round">1</b></div><button id="play" hidden>SPIN THE BALL ✦</button><p class="note">For entertainment only — no betting or real money.</p></main><script>
const colors=document.querySelector('#colors'),ball=document.querySelector('#ball'),machine=document.querySelector('#machine'),status=document.querySelector('#status'),play=document.querySelector('#play'),scoreEl=document.querySelector('#score'),roundEl=document.querySelector('#round'),historyEl=document.querySelector('#history');const shades={red:['#ff5964','#a8102c'],blue:['#54a5ff','#1951aa'],green:['#56d994','#087448'],yellow:['#ffe16b','#bf7900'],purple:['#c687ff','#6131a0'],orange:['#ffac55','#bd4b12']};let choice=null,answer,score=0,round=1,running=false,history=[];function reset(){choice=null;running=false;ball.className='ball waiting';ball.style.background='';machine.classList.remove('spinning');status.textContent='Choose your lucky color';play.hidden=true;colors.querySelectorAll('button').forEach(b=>{b.disabled=false;b.classList.remove('selected')})}colors.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||running)return;choice=b.dataset.color;colors.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));status.textContent=`You picked ${choice.toUpperCase()}`;play.hidden=false});play.addEventListener('click',()=>{if(!choice||running)return;running=true;const keys=Object.keys(shades);answer=keys[Math.floor(Math.random()*keys.length)];play.hidden=true;colors.querySelectorAll('button').forEach(b=>b.disabled=true);let left=3;status.textContent=`Spinning… ${left}`;machine.classList.add('spinning');const t=setInterval(()=>{left--;status.textContent=left?`Spinning… ${left}`:'Result!';if(!left){clearInterval(t);machine.classList.remove('spinning');ball.className='ball';ball.style.background=`radial-gradient(circle at 31% 24%,#fff 0 9%,#fff8 10%,transparent 24%),linear-gradient(145deg,${shades[answer][0]},${shades[answer][1]})`;history.push(`Round ${round}: ${answer.toUpperCase()}`);historyEl.textContent=`Results: ${history.join('  •  ')}`;if(choice===answer){score++;scoreEl.textContent=score;status.textContent='✦ Correct! Great guess.'}else status.textContent=`The ball is ${answer.toUpperCase()}.`;setTimeout(()=>{round++;roundEl.textContent=round;reset()},1800)}},1000)});reset();
</script></body></html>
